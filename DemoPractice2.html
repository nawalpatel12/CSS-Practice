<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <style>
    body {
      margin: 0px;
      padding: 0px;
    }

    .navbar {
      width: 100%;
      height: 100px;
      background-color: whitesmoke;
      display: flex;
      border-top-left-radius: 4px;
      border-top-right-radius: 4px;
    }

    .navbar-section {
      padding: 20px;
      display: flex;
      position: relative;
      align-items: center;
      padding-left: 30px;
    }

    .software{
        position: absolute;
        margin-top: 61px;
        padding-left: 37px;
    }

    .Company{
        color: rgb(92, 159, 201);
        position: absolute;
        margin-top: 61px;
        padding-left: 100px;
    }

    img {
      padding-top: 10px;
      width: 33px;
      height: 38px;
      background-color: whitesmoke;
      border-radius: 80px;
    }

    .navbar-select {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-left: 250px;
    }

    .sales {
      display: flex;
      align-items: center;
      color: rgb(92, 159, 201);
    }

    .fusion {
      display: flex;
      align-items: center;
    }

    .selectedCategory {
      display: flex;
      align-items: center;
      border: none;
      background-color: #f5f5f5;
      font-weight: bold;
    }

    a {
        color: black;
        font-weight: bold;
        margin-bottom: 4px;
        text-decoration: none;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 13px;

    }

    sup {
      font-size: 7px;
      margin-bottom: 20px;
      margin-left: -12px;
    }

    .button-section {
      display: flex;
      align-items: center;
      gap: 30px;
      margin-left: 50px;
    }

    .book {
      color: #44a5db;
      font: 14px sans-serif;
      font-weight: bolder;
      text-transform: uppercase;
      background-color: #ddefff;
      border: none;
      width: 150px;
      height: 50px;
      border-radius: 5px;
      padding: 12px 8px;
    }

    .login {
      color: #44a5db;
      font: 14px sans-serif;
       font-weight: bolder;
       text-transform: uppercase;
      background-color: #ddefff;
      border: none;
      width: 120px;
      height: 50px;
      border-radius: 5px;
      padding: 12px 8px;
    }

    .main-content {
        background-color: #0e4a7b;
        width: full;
        height: 600px;
    }


  </style>

  <body>
    <div class="navbar">
      <div class="navbar-section">
        <img src="image.png" alt="image" />
        <h1 class="sales">sales</h1>
        <h1 class="fusion">fusion<sup>320</sup></h1>
        <p class="software">Software </p> <p class="Company"> Company</p>

      </div>


      <div class="navbar-select">
        <a href="#">Home</a>

        <select class="selectedCategory">
          <option>Solutions</option>
        </select>

        <select class="selectedCategory">
          <option>Resources</option>
        </select>

        <select class="selectedCategory">
          <option>About Us</option>
        </select>
      </div>

      <div class="button-section">
        <button class="book">Book a demo</button>
        <button class="login">Log in</button>
      </div>
    </div>

    <div class="main-content" >


    </div>
  </body>
</html>
