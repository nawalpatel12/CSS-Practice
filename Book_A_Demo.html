<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Form</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background-color: #6b7280;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .form-wrapper {
        position: relative;
        width: 100%;
        max-width: 880px;
        background-color: #ffffff;
        border-radius: 10px;
        padding: 36px 40px 32px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      }

      .close-btn {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: none;
        background-color: #111827;
        color: #ffffff;
        font-size: 1.1rem;
        line-height: 1;
        display: grid;
        place-items: center;
        cursor: pointer;
      }

      .close-btn:hover {
        background-color: #374151;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px 28px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
      }

      .form-group > label,
      .group-label {
        font-size: 0.85rem;
        font-weight: 700;
        color: #1f2937;
        margin-bottom: 7px;
      }

      .req {
        color: #dc2626;
      }

      input[type="text"],
      input[type="tel"],
      input[type="email"],
      textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        font-family: inherit;
        font-size: 0.88rem;
        color: #111827;
        background-color: #ffffff;
      }

      input::placeholder,
      textarea::placeholder {
        color: #9ca3af;
      }

      input:focus,
      textarea:focus {
        outline: none;
        border-color: #2b7a9b;
        box-shadow: 0 0 0 3px rgba(43, 122, 155, 0.12);
      }

      textarea {
        resize: vertical;
        min-height: 96px;
      }

      .checkbox-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px 14px;
        padding-top: 2px;
      }

      .checkbox-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.84rem;
        color: #374151;
        cursor: pointer;
      }

      .checkbox-item input[type="checkbox"] {
        width: 15px;
        height: 15px;
        accent-color: #2b7a9b;
        cursor: pointer;
      }

      .form-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-top: 26px;
      }

      .recaptcha-box {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        background-color: #f9fafb;
        border: 1px solid #d3d3d3;
        border-radius: 3px;
        padding: 10px 14px;
        min-width: 260px;
      }

      .recaptcha-check {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.86rem;
        color: #1f2937;
        cursor: pointer;
      }

      .recaptcha-check input {
        width: 22px;
        height: 22px;
        cursor: pointer;
      }

      .recaptcha-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        line-height: 1.15;
      }

      .recaptcha-icon {
        font-size: 1.35rem;
        font-weight: 700;
        color: #2563eb;
      }

      .recaptcha-name {
        font-size: 0.62rem;
        font-weight: 600;
        color: #4b5563;
      }

      .recaptcha-links {
        font-size: 0.52rem;
        color: #6b7280;
      }

      .submit-btn {
        background-color: #e86854;
        color: #ffffff;
        border: none;
        border-radius: 5px;
        padding: 12px 34px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s ease;
      }

      .submit-btn:hover {
        background-color: #d95642;
      }

      .form-message {
        margin-top: 12px;
        font-size: 0.88rem;
        font-weight: 600;
        color: #15803d;
      }

      .form-message.error {
        color: #dc2626;
      }

      @media (max-width: 720px) {
        .form-wrapper {
          padding: 30px 20px 24px;
        }

        .form-grid,
        .checkbox-grid {
          grid-template-columns: 1fr;
          gap: 16px;
        }

        .form-footer {
          flex-direction: column;
          align-items: stretch;
        }

        .recaptcha-box,
        .submit-btn {
          width: 100%;
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="form-wrapper" id="formCard">
      <!-- Top-Right Circular Close Button -->
      <button
        type="button"
        class="close-btn"
        id="closeFormBtn"
        aria-label="Close form"
      >
        &times;
      </button>

      <form id="contactForm" novalidate>
        <div class="form-grid">
          <!-- Row 1 -->
          <div class="form-group">
            <label for="firstName">First Name <span class="req">*</span></label>
            <input
              type="text"
              id="firstName"
              name="firstName"
              placeholder="First Name"
              required
            />
          </div>

          <div class="form-group">
            <label for="lastName">Last Name</label>
            <input
              type="text"
              id="lastName"
              name="lastName"
              placeholder="Last Name"
            />
          </div>

          <!-- Row 2 -->
          <div class="form-group">
            <label for="companyName"
              >Company Name <span class="req">*</span></label
            >
            <input
              type="text"
              id="companyName"
              name="companyName"
              placeholder="Company Name"
              required
            />
          </div>

          <div class="form-group">
            <label for="phoneNumber"
              >Phone Number <span class="req">*</span></label
            >
            <input
              type="tel"
              id="phoneNumber"
              name="phoneNumber"
              placeholder="Phone Number"
              required
            />
          </div>

          <!-- Row 3 -->
          <div class="form-group">
            <label for="city">City</label>
            <input type="text" id="city" name="city" placeholder="City" />
          </div>

          <div class="form-group">
            <label for="email">Email <span class="req">*</span></label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Email Address"
              required
            />
          </div>

          <!-- Row 4: Checkboxes & Message -->
          <div class="form-group">
            <label class="group-label">
              Which solution are you interested in? <span class="req">*</span>
            </label>
            <div class="checkbox-grid">
              <label class="checkbox-item">
                <input type="checkbox" name="solution" value="DMS" />
                <span>DMS</span>
              </label>
              <label class="checkbox-item">
                <input
                  type="checkbox"
                  name="solution"
                  value="Sales Force Automation"
                />
                <span>Sales Force Automation</span>
              </label>
              <label class="checkbox-item">
                <input
                  type="checkbox"
                  name="solution"
                  value="Retailer Application"
                />
                <span>Retailer Application</span>
              </label>
              <label class="checkbox-item">
                <input type="checkbox" name="solution" value="Rural DMS" />
                <span>Rural DMS</span>
              </label>
              <label class="checkbox-item">
                <input
                  type="checkbox"
                  name="solution"
                  value="Asset Management"
                />
                <span>Asset Management</span>
              </label>
              <label class="checkbox-item">
                <input
                  type="checkbox"
                  name="solution"
                  value="AI & Data Analytics"
                />
                <span>AI &amp; Data Analytics</span>
              </label>
            </div>
          </div>

          <div class="form-group">
            <label for="message">Your Message <span class="req">*</span></label>
            <textarea
              id="message"
              name="message"
              rows="4"
              placeholder="Your Message"
              required
            ></textarea>
          </div>
        </div>

        <!-- Footer: reCAPTCHA & Submit Button -->
        <div class="form-footer">
          <div class="recaptcha-box">
            <label class="recaptcha-check">
              <input type="checkbox" id="notRobot" required />
              <span>I'm not a robot</span>
            </label>
            <div class="recaptcha-brand">
              <span class="recaptcha-icon" aria-hidden="true">&#8635;</span>
              <span class="recaptcha-name">reCAPTCHA</span>
              <span class="recaptcha-links">Privacy - Terms</span>
            </div>
          </div>

          <button type="submit" class="submit-btn">Submit Form</button>
        </div>

        <p class="form-message" id="formMessage" role="status"></p>
      </form>
    </div>

    <script>
      const formCard = document.getElementById("formCard");
      const closeFormBtn = document.getElementById("closeFormBtn");
      const contactForm = document.getElementById("contactForm");
      const formMessage = document.getElementById("formMessage");

      // Hide the form card when clicking the top-right X button
      closeFormBtn.addEventListener("click", () => {
        formCard.style.display = "none";
      });

      // Validate required fields, at least one checkbox, and reCAPTCHA on submit
      contactForm.addEventListener("submit", (e) => {
        e.preventDefault();
        formMessage.classList.remove("error");

        const checkedSolutions = contactForm.querySelectorAll(
          'input[name="solution"]:checked',
        );

        if (!contactForm.checkValidity() || checkedSolutions.length === 0) {
          formMessage.classList.add("error");
          formMessage.textContent =
            "Please complete all required (*) fields, select at least one solution, and verify reCAPTCHA.";
          return;
        }

        formMessage.textContent = "Form submitted successfully!";
        contactForm.reset();
      });
    </script>
  </body>
</html>
