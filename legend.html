<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        fieldset {
  border: 2px solid #3898dc;
  border-radius: 8px;
  padding: 20px;
}

legend {
  font-weight: bold;
  color: #3898dc;
  padding: 0 10px; /* Adds space around text so the border line doesn't touch it */
  font-size: 16px;
}
    </style>
</head>
<body>
    <form>
  <fieldset>
    <legend>Personal Information</legend>

    <label for="fname">First Name:</label>
    <input type="text" id="fname" name="fname"><br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email">
  </fieldset>
</form>
</body>
</html>
